<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAN Cube Smart Timer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-shell">
    <header class="app-header">
        <div>
            <h1 class="app-title">GAN Cube Timer</h1>
            <div class="status-line">
                <span id="statusBadge" class="status-badge">Disconnected</span>
                <span class="battery-pill">電池 <strong id="batteryLevel">--</strong></span>
            </div>
        </div>
        <button class="icon-btn" id="moreBtn" type="button" aria-label="設定">⚙</button>
    </header>

    <section class="visualizer-area" aria-label="仮想キューブ">
        <div id="cubeVisualizer" class="cube-visualizer"></div>
        <button class="focus-mode-btn" id="focusModeBtn" type="button" aria-pressed="false">フォーカス OFF</button>
        <button class="view-reset-btn" id="cameraResetBtn" type="button">視点リセット</button>
    </section>

    <section class="timer-card">
        <div class="page-tabs" role="tablist" aria-label="表示切替">
            <button class="page-tab active" id="timerPageBtn" type="button" aria-pressed="true">タイマー</button>
            <button class="page-tab" id="logPageBtn" type="button" aria-pressed="false">ログ</button>
        </div>

        <div class="timer-page active" id="timerPage">
            <div id="scrambleDisplay">「スクランブル」または [ U U' ] で開始</div>

            <div class="timer-container" id="timerArea">
                <div id="timerDisplay">0.00</div>
                <div id="timerSubtext"></div>
            </div>

            <div class="penalty-group" id="penaltyGroup">
                <button class="pen-btn ok-active" id="btnOk" type="button">OK</button>
                <button class="pen-btn" id="btnPlus2" type="button">+2</button>
                <button class="pen-btn" id="btnDnf" type="button">DNF</button>
            </div>

            <div class="stats-strip">
                <div class="stat-box"><span id="statPb">--</span><div class="stat-label">PB</div></div>
                <div class="stat-box"><span id="statAo5">--</span><div class="stat-label">Ao5</div></div>
                <div class="stat-box"><span id="statAo12">--</span><div class="stat-label">Ao12</div></div>
                <div class="stat-box"><span id="statCount">0</span><div class="stat-label">Solves</div></div>
                <div class="stat-box stat-secondary"><span id="statBest">--</span><div class="stat-label">Best</div></div>
                <div class="stat-box stat-secondary"><span id="statWorst">--</span><div class="stat-label">Worst</div></div>
            </div>
        </div>

        <div class="log-page" id="logPage" hidden>
            <div class="solve-log-panel">
                <div class="solve-log-header">
                    <span>直近10回のソルブログ</span>
                    <select class="replay-speed-select" id="replaySpeedSelect" aria-label="再生速度">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                    <button class="mini-btn" id="clearSolveLogsBtn" type="button">クリア</button>
                </div>
                <div class="replay-seek-row">
                    <input id="replaySeekBar" class="replay-seek" type="range" min="0" max="0" value="0" step="10" disabled>
                    <span id="replaySeekTime" class="replay-time">0.00 / 0.00</span>
                    <button class="mini-btn replay-toggle-btn" id="replayPauseBtn" type="button" disabled>一時停止</button>
                </div>
                <div id="solveLogList" class="solve-log-list"></div>
            </div>
        </div>
    </section>

    <nav class="action-grid" aria-label="主要操作">
        <button class="main-btn btn-connect" id="connectBtn" type="button">接続</button>
        <button class="main-btn btn-scramble" id="scrambleBtn" type="button" aria-label="スクランブル"><span class="label-full">スクランブル</span><span class="label-short">混ぜる</span></button>
        <button class="main-btn btn-assist" id="assistBtn" type="button" aria-label="最短アシスト"><span class="label-full">最短アシスト</span><span class="label-short">最短</span></button>
        <button class="main-btn btn-cross" id="crossAssistBtn" type="button" aria-label="手順アシスト"><span class="label-full">手順アシスト</span><span class="label-short">手順</span></button>
        <button class="main-btn btn-more" id="openToolsBtn" type="button">ツール</button>
    </nav>
</main>

<div class="modal-backdrop" id="settingsModal" aria-hidden="true">
    <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-header">
            <h2 id="settingsTitle">ツール</h2>
            <button class="icon-btn" id="closeSettingsBtn" type="button" aria-label="閉じる">×</button>
        </div>

        <div class="settings-section">
            <label class="setting-row">
                <span>U U' 自動スクランブル</span>
                <span class="switch">
                    <input type="checkbox" id="uuShortcutToggle">
                    <span class="slider"></span>
                </span>
            </label>
            <label class="mac-row">
                <span>Cube MAC</span>
                <input id="cubeMacInput" class="mac-input" type="text" placeholder="AA:BB:CC:DD:EE:FF" autocomplete="off" spellcheck="false">
            </label>
        </div>

        <div class="settings-actions">
            <button class="main-btn btn-state-reset" id="resetCubeStateBtn" type="button">状態を完成に同期</button>
            <button class="main-btn btn-reset" id="resetBtn" type="button">仮想キューブをリセット</button>
            <button class="main-btn btn-clear" id="clearSessionBtn" type="button">履歴クリア</button>
        </div>

        <div id="moveLog">Waiting for moves...</div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
