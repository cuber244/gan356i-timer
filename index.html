<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAN Cube Smart Timer Pro</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://cdn.cubing.net/js/cubing/twisty"></script>
</head>
<body>

<header><h1 class="app-title">GAN Cube Smart Timer Pro</h1></header>

<div class="main-layout">
    <div class="visualizer-area">
        <twisty-player id="cubeVisualizer" visualization="3D" control-panel="none" back-view="none" background="none" tempo-scale="2"></twisty-player>
    </div>

    <div class="info-area">
        <div class="card">
            <h2>⏱️ Solve Timer</h2>
            <div id="scrambleDisplay">Push "Generate Scramble" or [ U U' ]</div>

            <div class="timer-container" id="timerArea">
                <div id="timerDisplay">0.00</div>
                <div id="timerSubtext"></div>
            </div>

            <div class="penalty-group" id="penaltyGroup">
                <button class="pen-btn ok-active" id="btnOk">OK</button>
                <button class="pen-btn" id="btnPlus2">+2</button>
                <button class="pen-btn" id="btnDnf">DNF</button>
            </div>

            <div class="stats-grid">
                <div class="stat-box"><div class="stat-label">PB</div><span id="statPb">--</span></div>
                <div class="stat-box"><div class="stat-label">Ao5</div><span id="statAo5">--</span></div>
                <div class="stat-box"><div class="stat-label">Ao12</div><span id="statAo12">--</span></div>
                <div class="stat-box"><div class="stat-label">Best</div><span id="statBest">--</span></div>
                <div class="stat-box"><div class="stat-label">Worst</div><span id="statWorst">--</span></div>
                <div class="stat-box"><div class="stat-label">Solves</div><span id="statCount">0</span></div>
            </div>

            <button class="main-btn btn-scramble" id="scrambleBtn">🎲 スクランブル生成</button>
        </div>

        <div class="card split-card">
            <div class="panel">
                <h2>Connection</h2>
                <span id="statusBadge" class="status-badge">Disconnected</span>
                <div class="battery-row">
                    <span>Battery</span>
                    <span id="batteryLevel" class="battery-value">--</span>
                </div>
                <button class="main-btn btn-compact" id="connectBtn">Connect</button>
            </div>
            <div class="panel">
                <h2>Tools</h2>
                <div class="setting-row">
                    <span>U U' 自動生成</span>
                    <label class="switch" for="uuShortcutToggle">
                        <input type="checkbox" id="uuShortcutToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <button class="main-btn btn-compact btn-assist" id="assistBtn">アシスト</button>
                <button class="main-btn btn-compact btn-reset" id="resetBtn">仮想キューブをリセット</button>
                <button class="main-btn btn-compact btn-clear" id="clearSessionBtn">履歴クリア</button>
            </div>
        </div>
        <div id="moveLog">Waiting for moves...</div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
