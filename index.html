<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAN Cube Smart Timer</title>
    <script type="module" src="https://cdn.cubing.net/js/cubing/twisty"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }

        header {
            padding: 10px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            background: #16213e;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            gap: 15px;
        }

        .visualizer-area {
            width: 100%;
            height: 300px;
            background: radial-gradient(circle, #243447 0%, #1a1a2e 100%);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        twisty-player { width: 100%; height: 100%; }

        .info-area { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        .card { background: #0f3460; padding: 12px; border-radius: 12px; }

        h2 { font-size: 0.9rem; margin-top: 0; color: #48abe0; margin-bottom: 8px; }

        #scrambleDisplay {
            font-size: 1rem;
            min-height: 2.5rem;
            line-height: 1.4;
            background: #16213e;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            word-break: break-all;
        }
        #timerDisplay { font-size: 3rem; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 5px 0; font-weight: bold; }
        #ao5Display { font-size: 1.1rem; text-align: center; color: #48abe0; margin-bottom: 10px; }

        .scramble-step { display: inline-block; margin: 0 3px; padding: 2px 6px; border-radius: 4px; }
        .scramble-completed { color: #555; text-decoration: line-through; }
        .scramble-current { background-color: #f39c12; color: #fff; font-weight: bold; transform: scale(1.1); }
        .scramble-correction { background-color: #e74c3c; color: #fff; font-weight: bold; }
        .scramble-correction-queue { color: #e74c3c; opacity: 0.7; }

        .status-container { display: flex; flex-direction: column; gap: 5px; }
        .status-row { display: flex; justify-content: space-between; font-size: 0.85rem; }
        .status-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; background: #e94560; }
        .connected { background: #0fdb92; }

        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #48abe0; color: white; font-weight: bold; font-size: 1rem; margin-top: 5px; }

        #moveLog { font-family: monospace; background: #16213e; padding: 8px; height: 60px; overflow-y: auto; border-radius: 4px; font-size: 1rem; color: #f7d138; }
    </style>
</head>
<body>

<header>
    <h1 style="margin: 0; font-size: 1.2rem;">GAN Cube Smart Timer</h1>
</header>

<div class="main-layout">
    <div class="visualizer-area">
        <twisty-player id="cubeVisualizer" visualization="3D" control-panel="none" back-view="none" background="none"></twisty-player>
    </div>

    <div class="info-area">
        <div class="card">
            <h2>⏱️ Solve Timer</h2>
            <div id="scrambleDisplay">Push "Generate Scramble" or [ U U' ]</div>
            <div id="timerDisplay">0.00</div>
            <div id="ao5Display">Ao5: --</div>
            <button id="scrambleBtn">🎲 スクランブル生成</button>
        </div>

        <div class="card">
            <h2>Connection Status</h2>
            <div class="status-container">
                <div class="status-row">
                    <span>GAN Cube (Bluetooth)</span>
                    <span id="statusBadge" class="status-badge">Disconnected</span>
                </div>
            </div>
            <button id="connectBtn">Connect Smart Cube</button>
        </div>

        <div class="card">
            <h2>Tools</h2>
            <div id="moveLog">Waiting for moves...</div>
            <button id="syncBtn" disabled>🔄 物理キューブの盤面を再取得</button>
            <button id="resetBtn" style="background:#c0392b;">🗑️ リセット</button>
        </div>
    </div>
</div>

<script type="module">
    import { connectGanCube } from 'https://esm.sh/gan-web-bluetooth';

    const connectBtn = document.getElementById('connectBtn');
    const scrambleBtn = document.getElementById('scrambleBtn');
    const syncBtn = document.getElementById('syncBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusBadge = document.getElementById('statusBadge');
    const moveLog = document.getElementById('moveLog');
    const scrambleDisplay = document.getElementById('scrambleDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const ao5Display = document.getElementById('ao5Display');
    const twistyElement = document.getElementById('cubeVisualizer');

    let cubeConnection = null;
    let startTime = 0, lastMoveTime = 0, timerInterval = null;
    let isReady = false, isSolving = false, isScrambling = false;
    let scrambleSequence = [], currentScrambleStep = 0, mistakeStack = [];
    let solveTimes = [], lastManualMove = "", lastManualMoveTime = 0;

    function formatTime(ms) { return (ms / 1000).toFixed(2); }

    function updateAo5() {
        if (solveTimes.length < 5) { ao5Display.textContent = "Ao5: --"; return; }
        const last5 = solveTimes.slice(-5);
        const avg = (last5.reduce((a,b)=>a+b,0) - Math.min(...last5) - Math.max(...last5)) / 3;
        ao5Display.textContent = `Ao5: ${formatTime(avg)}`;
    }

    function checkIsSolved(faceletsStr) {
        if (!faceletsStr) return false;
        const cleanStr = faceletsStr.trim().toUpperCase().replace(/\s/g, '');
        if (cleanStr.length !== 54) return false;
        if (cleanStr === "UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB") return true;
        for (let i = 0; i < 6; i++) {
            const face = cleanStr.slice(i * 9, i * 9 + 9);
            for (let j = 1; j < 9; j++) if (face[j] !== face[0]) return false;
        }
        return true;
    }

    function generateSimpleScramble(length = 21) {
        const faces = ['U', 'D', 'R', 'L', 'F', 'B'], modifiers = ['', "'"];
        let scramble = [], last = '', sec = '';
        for (let i = 0; i < length; i++) {
            let f;
            do { f = faces[Math.floor(Math.random() * faces.length)]; } while (f === last || (f === sec && ((f==='U'&&last==='D')||(f==='D'&&last==='U')||(f==='R'&&last==='L')||(f==='L'&&last==='R')||(f==='F'&&last==='B')||(f==='B'&&last==='F'))));
            scramble.push(f + modifiers[Math.floor(Math.random() * modifiers.length)]);
            sec = last; last = f;
        }
        return scramble;
    }

    function getInverse(m) { return m.endsWith("'") ? m[0] : (m.endsWith("2") ? m : m + "'"); }

    function renderScrambleUI() {
        scrambleDisplay.innerHTML = "";
        if (scrambleSequence.length === 0) { scrambleDisplay.textContent = 'Push "Generate Scramble" or [ U U\' ]'; return; }
        if (mistakeStack.length > 0) {
            const d = document.createElement('div'); d.style.color = '#e74c3c'; d.textContent = '⚠️ ミス検知: 元に戻してください'; scrambleDisplay.appendChild(d);
            for (let i = mistakeStack.length - 1; i >= 0; i--) { const s = document.createElement('span'); s.textContent = mistakeStack[i]; s.className = 'scramble-step ' + (i===mistakeStack.length-1?'scramble-correction':'scramble-correction-queue'); scrambleDisplay.appendChild(s); }
            return;
        }
        scrambleSequence.forEach((m, i) => { const s = document.createElement('span'); s.textContent = m; s.className = 'scramble-step ' + (i<currentScrambleStep?'scramble-completed':(i===currentScrambleStep?'scramble-current':'scramble-pending')); scrambleDisplay.appendChild(s); });
    }

    scrambleBtn.addEventListener('click', () => {
        scrambleSequence = generateSimpleScramble(21); currentScrambleStep = 0; isScrambling = true; mistakeStack = [];
        twistyElement.alg = ""; twistyElement.removeAttribute('facelets');
        renderScrambleUI(); isReady = false; isSolving = false; clearInterval(timerInterval); timerDisplay.textContent = "0.00";
    });

    resetBtn.addEventListener('click', () => { location.reload(); });

    connectBtn.addEventListener('click', async () => {
        try {
            cubeConnection = await connectGanCube();
            statusBadge.textContent = "Connected"; statusBadge.className = "status-badge connected"; connectBtn.disabled = true; syncBtn.disabled = false;
            cubeConnection.events$.subscribe((event) => {
                if (event.type === "MOVE") {
                    const now = Date.now();
                    if (!isScrambling && !isSolving && !isReady) {
                        if (((event.move==="U'"&&lastManualMove==="U")||(event.move==="U"&&lastManualMove==="U'")) && (now-lastManualMoveTime<=1000)) { scrambleBtn.click(); return; }
                        lastManualMove = event.move; lastManualMoveTime = now;
                    }
                    lastMoveTime = now;
                    if (isScrambling) {
                        if (mistakeStack.length > 0) { if (event.move === mistakeStack[mistakeStack.length-1]) mistakeStack.pop(); else mistakeStack.push(getInverse(event.move)); renderScrambleUI(); }
                        else if (event.move === scrambleSequence[currentScrambleStep]) {
                            currentScrambleStep++;
                            if (currentScrambleStep >= scrambleSequence.length) { isScrambling = false; isReady = true; scrambleDisplay.innerHTML = "<span style='color:#f39c12;'>スクランブル完了！回すとスタート</span>"; timerDisplay.style.color = "#f39c12"; } else renderScrambleUI();
                        } else { mistakeStack.push(getInverse(event.move)); renderScrambleUI(); }
                    }
                    if (isReady && !isSolving && !isScrambling) { isSolving = true; isReady = false; startTime = now; timerInterval = setInterval(()=>timerDisplay.textContent = formatTime(Date.now() - startTime), 10); }
                    moveLog.textContent = event.move; twistyElement.experimentalAddMove(event.move);
                } else if (event.type === "FACELETS") {
                    if (isSolving && checkIsSolved(event.facelets)) { clearInterval(timerInterval); isSolving = false; timerDisplay.textContent = formatTime(lastMoveTime - startTime); timerDisplay.style.color = "#0fdb92"; solveTimes.push(lastMoveTime - startTime); updateAo5(); }
                    try { twistyElement.facelets = event.facelets; } catch(e){}
                }
            });
        } catch(e) { alert(e); }
    });
</script>
</body>
</html>
